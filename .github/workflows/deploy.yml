name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare's Pages API has rejected commit messages containing
          # em-dash and certain CJK codepoints with
          # "Invalid commit message, it must be a valid UTF-8 string"
          # [code: 8000111]. Strip to printable ASCII before sending.
          raw_msg="$(git log -1 --pretty=%s)"
          ascii_msg="$(printf '%s' "$raw_msg" | LC_ALL=C tr -cd '\11\12\15\40-\176' | head -c 200)"
          if [ -z "$ascii_msg" ]; then
            ascii_msg="deploy ${GITHUB_SHA:0:7}"
          fi
          pnpm dlx wrangler@4 pages deploy ./dist \
            --project-name lin-hsiehting \
            --branch main \
            --commit-dirty=true \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$ascii_msg"
