name: Auto-render print PDFs on push

# Triggered automatically when any post .mdx changes.
# Renders journal-style B&W PDFs from /print/<slug> routes via Playwright,
# then commits public/pdf/<id>.pdf back to main with `[skip pdf]` tag (so
# this workflow doesn't re-trigger on its own commit).
#
# Path filter intentionally excludes public/pdf/** to avoid loops.

on:
  push:
    branches: [main]
    paths:
      - "src/posts/**/*.mdx"
      - "src/layouts/Print.astro"
      - "src/pages/print/**"
      - "src/styles/print.css"
      - "scripts/render-pdfs.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: pnpm run build

      - name: Start preview server
        run: |
          nohup pnpm exec astro preview --host 127.0.0.1 --port 4321 \
            > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4321 > /dev/null; then
              echo "preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview server did not start"
          cat /tmp/astro-preview.log
          exit 1

      - name: Render PDFs
        run: node scripts/render-pdfs.mjs --base=http://127.0.0.1:4321 --force

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/astro-preview.pid ]; then
            kill "$(cat /tmp/astro-preview.pid)" 2>/dev/null || true
          fi

      - name: Commit PDFs
        run: |
          if git diff --quiet -- 'public/pdf/'; then
            echo "no PDF changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'public/pdf/'
          git commit -m "chore: render print PDFs [skip pdf]"
          git push
